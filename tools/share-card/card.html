<!doctype html>
<!-- The link-preview card: what WhatsApp, Instagram DMs and Facebook show when
     someone pastes the site's address. It is rendered to a JPEG by
     tools/make-share-card.js and served as og:image; nothing here runs on the
     live site.

     Everything that matters - the logo, the name, the caption and both
     platform marks - sits inside the centre 630x630, because WhatsApp
     sometimes shows the preview as a square thumbnail cropped from the middle.
     The photographs at the edges are the only thing allowed to be cut off. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Instrument Serif'; src: url(../../web/fonts/instrument-serif-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url(../../web/fonts/instrument-serif-400-italic.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; src: url(../../web/fonts/inter-var.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: #f3efe6; color: #1c2f26;
    display: grid; grid-template-columns: 285px 630px 285px;
  }
  .edge { background: url(../../assets/brand/hero-wide-pool.jpg) center / cover; }
  .edge--l { background-position: 18% 60%; }
  .edge--r { background-position: 82% 60%; }
  .mid {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 28px 30px;
    box-shadow: -1px 0 0 #d9d2c3, 1px 0 0 #d9d2c3;
  }
  .logo { width: 232px; height: 232px; border-radius: 50%;
          box-shadow: 0 2px 4px rgba(20,24,20,.14), 0 14px 34px rgba(20,24,20,.16); }
  .name { font-family: 'Instrument Serif', serif; font-size: 60px; line-height: 1;
          letter-spacing: -.01em; margin: 26px 0 0; }
  .name em { color: #a0522d; }
  .line { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 15px;
          letter-spacing: .18em; text-transform: uppercase; color: #5b6660; margin: 14px 0 0; }
  .social { display: flex; gap: 28px; margin-top: 26px;
            font-family: 'Inter', sans-serif; font-size: 20px; color: #26302b; }
  .social span { display: inline-flex; align-items: center; gap: 10px; }
</style></head>
<body>
<div class="card">
  <div class="edge edge--l"></div>
  <div class="mid">
    <img class="logo" src="logo-360.png" alt="">
