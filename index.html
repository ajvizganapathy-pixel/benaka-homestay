<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benaka By The Hills — homestay in Coorg</title>

<!-- The site itself lives in web/. This stub only exists so that opening the
     repository root gives the homestay rather than a directory listing.

     On Hostinger it is never reached: .htaccess maps / to web/index.html with an
     internal rewrite, so visitors get the site at a clean / with no hop. This is
     the fallback for everywhere .htaccess does not apply — a local
     python3 -m http.server, a non-Apache static host, or opening the files
     directly. -->

<meta name="description" content="A homestay in Coorg, Karnataka, near Irpu Falls.">
<!-- LINK PREVIEWS (WhatsApp, Instagram DMs, Facebook). Scrapers need ABSOLUTE
     URLs and do not run JavaScript, so this exact block is ALSO in the root
     index.html redirect stub - that is the address people share - and
     tools/test.sh fails if the two copies differ. When benakahomestay.com goes
     live, replace the base URL in both files. The picture is
     assets/brand/share-card.jpg, rendered by tools/make-share-card.js. -->
<meta property="og:site_name" content="Benaka By The Hills">
<meta property="og:title" content="Benaka By The Hills — a homestay in Coorg">
<meta property="og:description" content="A quiet homestay near Irpu Falls, Coorg: a pool with the hill behind it, rooms on a long verandah, meals at one table. Instagram @benakabythehills · Facebook Benaka Bythehills">
<meta property="og:url" content="https://ajvizganapathy-pixel.github.io/benaka-homestay/">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_IN">
<meta property="og:image" content="https://ajvizganapathy-pixel.github.io/benaka-homestay/assets/brand/share-card.jpg">
<meta property="og:image:secure_url" content="https://ajvizganapathy-pixel.github.io/benaka-homestay/assets/brand/share-card.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The round Benaka logo on ivory, with the pool and the house at sunset either side, and the Instagram and Facebook handles">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Benaka By The Hills — a homestay in Coorg">
<meta name="twitter:description" content="A quiet homestay near Irpu Falls, Coorg: a pool with the hill behind it, rooms on a long verandah, meals at one table. Instagram @benakabythehills · Facebook Benaka Bythehills">
<meta name="twitter:image" content="https://ajvizganapathy-pixel.github.io/benaka-homestay/assets/brand/share-card.jpg">
<!-- /LINK PREVIEWS -->
<link rel="canonical" href="https://ajvizganapathy-pixel.github.io/benaka-homestay/">
<meta http-equiv="refresh" content="0; url=web/">
<link rel="icon" href="web/favicon-64.png" type="image/png" sizes="64x64">

<style>
  /* The site's own ground, so the instant before the redirect is not a white
     flash on the way in. */
  html, body { height: 100%; margin: 0; background: #14171a; color: #ecebe7; }
  body {
    display: grid; place-content: center; gap: 18px; text-align: center;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  p { margin: 0; font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; color: #99a0a8; }
  a { color: #e08b60; }
</style>
</head>
<body>
  <p>Benaka By The Hills</p>
  <!-- Last resort: shown only if both the meta refresh and the script are blocked. -->
  <p><a href="web/">Open the site</a></p>

<script>
  // replace(), not assign() — this stub must not leave a history entry, or Back
  // would land here and immediately throw the visitor forward again.
  location.replace('web/');
</script>
</body>
</html>
