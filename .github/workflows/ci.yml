# The same script a contributor runs locally. Nothing here is CI-only, so a
# green pipeline and a green laptop mean the same thing.
name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, pdo_mysql, sodium, intl
          coverage: none

      # The guest review suite runs on a real database. The runner image ships
      # MySQL 8 (root/root), stopped; start it. Hostinger runs MariaDB, which
      # the same suite is also run against locally before every PR.
      - name: Start MySQL for the review tests
        run: sudo systemctl start mysql.service && mysqladmin --user=root --password=root --wait=30 ping

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run the suite
        env:
          REVIEWS_TEST_DSN: 'mysql:host=127.0.0.1;port=3306'
          REVIEWS_TEST_USER: root
          REVIEWS_TEST_PASS: root
          # A database skip is a failure here; the browser suite may skip.
          REVIEWS_REQUIRE_DB: '1'
        run: bash tools/test.sh
